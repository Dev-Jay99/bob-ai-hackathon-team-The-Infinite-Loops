submission:
  title: "FinGuard"

  problem_statement: >
    Bank fraud and AML investigators must manually correlate transaction data, customer
    history, device signals, network connections and risk scores across disconnected systems
    — a process that takes 45–90 minutes per alert and results in delayed SAR filings,
    missed fraud patterns and investigator burnout. High-volume alert queues mean critical
    cases go unreviewed for hours.

  solution_summary: >
    FinGuard is an enterprise-grade AI-powered Bank Fraud and AML Investigation Operations
    platform that consolidates every evidence signal — risk score, transaction context,
    customer baseline, account network and AI-generated analysis — into a single investigator
    workspace. Investigators open one alert, see all evidence, consult the AI Copilot and
    make a documented decision in minutes rather than hours.

  key_features:
    - "Multi-factor risk scoring with 6 explainable factors and visual progress bars — Amount, Location, Device, Time, Velocity and Network anomaly"
    - "Interactive account network graph (vis-network) showing transaction relationships and flagged pass-through accounts up to 3 hops deep"
    - "Case-aware AI Copilot with suggested questions, chat interface and one-click Investigation Brief generation"
    - "Full investigator decision workflow — Escalate, Monitor or Mark Legitimate — with real-time status updates and operational notes"
    - "Paginated alerts queue with debounced search and filtering by risk level, status and location, backed by dual-mode JSON or PostgreSQL database"

  tech_stack:
    languages: ["JavaScript", "HTML5", "CSS3", "SQL"]
    frameworks: ["Express.js", "Node.js"]
    ibm_technologies: ["IBM Bob AI Platform"]
    databases: ["JSON File Store", "PostgreSQL"]
    other: ["Chart.js", "vis-network", "Google Fonts Inter", "Jest", "Supertest", "Docker-ready"]

  what_we_are_most_proud_of: >
    The Alert Details investigator workspace. It is a purpose-built, evidence-driven
    investigation environment — not a generic dashboard. Every element (risk factors
    with progress bars, baseline comparison, transaction sequence, network graph,
    AI Copilot and decision buttons) is designed around the investigator's workflow.
    The benchmark case ALT-10482 demonstrates the full end-to-end journey from alert
    discovery to investigation brief generation.

  known_limitations: >
    Authentication is mocked — the user profile is a static display, not a real login.
    The AI Copilot returns placeholder responses until Member 4 integrates watsonx.ai.
    The Risk Engine returns pre-generated scores until Member 3 implements the real model.
    The network graph shows stub data for non-benchmark accounts; real traversal requires
    Member 3 database-driven implementation. Tested on Chrome and Firefox only.

